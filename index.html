<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qinglan Shan</title>
<meta name="description" content="Qinglan Shan: mixed reality, embodied learning and HCI. Portfolio, projects, research and photographs.">
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="assets/site/fonts.css">
<style>
body{margin:0; background-color: #FEFDFB; }
a{color:var(--ink)}a:hover{color:var(--accent)}
.day{--paper:#F3EDE1;--ink:#22201C;--muted:#5C564C;--desk:#EBE3D3;--card:#FBF8F1;--accent:#B23A26;--veil:rgba(243,237,225,.82)}
.night{--paper:#171513;--ink:#EEE7D7;--muted:#B3AA98;--desk:#221F1B;--card:#2B2722;--accent:#E8775C;--veil:rgba(15,14,12,.8)}
.glow{background:radial-gradient(circle,rgba(255,214,140,.55) 0%,rgba(255,200,120,.18) 38%,transparent 68%);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.8}}
.cam .af{opacity:0}
.cam:hover .af,.cam:focus-visible .af{animation:af .45s steps(2) 2 both}
@keyframes af{0%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
.flash{position:absolute;inset:-8%;border-radius:12px;background:#FFFFFF;animation:flash .25s ease-out both;pointer-events:none}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.stk{position:absolute;background:none;border:0;padding:0;cursor:pointer;transform:rotate(var(--r));transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.stk img{display:block;width:100%;height:auto;filter:drop-shadow(2px 4px 0 rgba(34,32,28,.2))}
.stk svg{display:block;width:100%;height:auto;filter:drop-shadow(2px 3px 0 rgba(34,32,28,.18))}
.stk:hover,.stk:focus-visible{transform:rotate(calc(var(--r) + 5deg)) scale(1.07);z-index:5}
.stk:focus-visible{outline:2px dashed #B23A26;outline-offset:6px}
.card{transition:transform .25s ease}
.card:hover{transform:translateY(-6px) rotate(0deg)!important}
.ph{background-color:#E7DFCF;background-image:repeating-linear-gradient(-45deg,rgba(34,32,28,.07) 0 2px,transparent 2px 10px)}
.spin{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sheet{animation:unfold .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes unfold{0%{transform:scale(.12) rotate(-60deg);opacity:.4}70%{transform:scale(1.03) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(-1.5deg)}}
.wob{animation:wob 3s ease-in-out infinite}
@keyframes wob{50%{transform:translateY(-4px) rotate(2deg)}}
.navlink{text-decoration:none;font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif;font-size:14px;letter-spacing:.04em;padding:10px 4px;border-bottom:2px solid transparent}
.navlink:hover{border-bottom-color:#B23A26}
.lang{background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;color:inherit;min-height:40px}
.photo-tag{position:absolute;font-family:'Gaegu','Songti SC','STSong','SimSun','Noto Serif SC','Source Han Serif SC',cursive;font-weight:700;font-size:20px;text-decoration:none;color:var(--ink);background:var(--card);padding:4px 12px;box-shadow:2px 3px 0 rgba(34,32,28,.15);white-space:nowrap}
.photo-tag:hover{color:#B23A26}
.stk>img{position:relative}
/* notebook desk + lamp light */
.notebook{position:absolute;left:-6%;top:3%;width:112%;max-width:none;transform:rotate(-5deg);filter:drop-shadow(4px 10px 14px rgba(34,32,28,.22));pointer-events:none;user-select:none}
.light{position:absolute;pointer-events:none;z-index:4;transition:opacity .6s ease}
.lday{background:radial-gradient(circle at 78% 64%, rgba(255,222,160,.42) 0%, rgba(255,214,140,.16) 22%, rgba(255,214,140,0) 46%);mix-blend-mode:soft-light}
.lnight{background:radial-gradient(circle at 78% 64%, rgba(255,206,130,.30) 0%, rgba(255,190,110,.12) 18%, rgba(23,21,19,.2) 34%, rgba(23,21,19,.66) 60%, rgba(23,21,19,.82) 100%);-webkit-mask-image:radial-gradient(closest-side, #000 62%, transparent 100%);mask-image:radial-gradient(closest-side, #000 62%, transparent 100%)}
.day .lnight,.night .lday{opacity:0}
.stk:hover,.stk:focus-visible{z-index:6}
/* cassette reels */
.tape>img.hub{position:absolute;width:10.842%;height:auto;filter:none;pointer-events:none}
.tape:hover>img.hub,.tape:focus-visible>img.hub,.tape:active>img.hub{animation:spin 1.1s linear infinite}
/* paper note */
.paper{position:relative;width:clamp(300px,44vw,720px);max-width:100%;min-height:calc(clamp(300px,44vw,720px) * 415 / 583);background:url(assets/site/4dbe0b6f91adfcab60228e6a1f78e16b.webp) center/100% 100% no-repeat;padding:clamp(40px,9%,96px) 11% clamp(36px,8%,84px) 10.5%;box-sizing:border-box;color:#22201C;display:flex;filter:drop-shadow(0 14px 24px rgba(34,32,28,.25))}
/* telephone */
.phone{position:relative;flex:0 0 58px;align-self:flex-start;margin-top:-6px;background:none;border:0;padding:0;cursor:pointer}
.phone .drop{display:block;animation:drop 1.5s cubic-bezier(.25,1.35,.45,1) .2s both}
@keyframes drop{from{transform:translateY(-110vh)}to{transform:none}}
.phone .spring{display:block;position:relative}
.phone .cord{position:absolute;left:calc(44% - 11px);bottom:calc(100% - 6px);width:22px;height:960px;overflow:visible}
.phone .hand{display:block;transform-origin:44% 2%}
.phone .hand img{display:block;width:58px;height:auto;filter:drop-shadow(2px 6px 6px rgba(34,32,28,.25))}
.phone:hover .spring,.phone:focus-visible .spring{animation:boing 1.5s cubic-bezier(.3,.6,.4,1)}
@keyframes boing{0%{transform:none}18%{transform:translateY(-54px)}40%{transform:translateY(16px)}58%{transform:translateY(-8px)}76%{transform:translateY(4px)}100%{transform:none}}
.phone:hover .hand,.phone:focus-visible .hand{animation:swing 1.9s ease-out}
@keyframes swing{0%{transform:none}14%{transform:rotate(-15deg)}32%{transform:rotate(13deg)}50%{transform:rotate(-8deg)}68%{transform:rotate(5deg)}84%{transform:rotate(-2deg)}100%{transform:none}}
.phone .waves path{opacity:0;animation:wave 2.4s ease-out infinite}
.phone .waves path:nth-child(2){animation-delay:.3s}
.phone .waves path:nth-child(3){animation-delay:.6s}
@keyframes wave{0%{opacity:0;transform:translateX(-4px)}30%{opacity:.8}100%{opacity:0;transform:translateX(6px)}}
.phone:focus-visible{outline:2px dashed #B23A26;outline-offset:6px}
@media (min-width: 1360px){.phone{margin-left:-84px;margin-right:4px}}
.prize{align-self:flex-start;background:none;border:0;padding:0;cursor:pointer;width:170px;transform:rotate(-8deg);transition:transform .35s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(2px 4px 0 rgba(34,32,28,.15))}
.prize img{display:block;width:100%;height:auto}
.prize:hover,.prize:focus-visible{transform:rotate(4deg) scale(1.08)}
.prize:focus-visible{outline:2px dashed #B23A26;outline-offset:6px}
.awards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:clamp(6px,.7vw,10px)}
.awards li{display:grid;grid-template-columns:5.5em 1fr;gap:14px;align-items:baseline;border-bottom:1.5px dashed rgba(34,32,28,.3);padding-bottom:6px}
.poke{position:absolute;left:96px;top:626px;z-index:5;margin:0;display:flex;align-items:flex-start;gap:6px;font-family:'Gaegu','Songti SC','STSong','SimSun','Noto Serif SC','Source Han Serif SC',cursive;font-size:22px;font-weight:700;color:var(--muted);transform:rotate(-2deg);white-space:nowrap}
@media (prefers-reduced-motion: reduce){.prize{transition:none}}
@media (prefers-reduced-motion: reduce){.phone .drop,.phone .spring,.phone .hand,.phone .waves path,.tape>img.hub{animation:none!important}.phone .waves path{opacity:.6}}
.tape .reel{position:absolute;left:0;top:0;width:100%;height:auto;overflow:visible;pointer-events:none;filter:none}
.tape .reel path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .7s ease-in}
.tape:hover .reel path,.tape:focus-visible .reel path{stroke-dashoffset:0;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.7,.3,1)}
.tape:hover .reel path:nth-child(2),.tape:focus-visible .reel path:nth-child(2){transition-delay:.25s}
.tape:hover .reel,.tape:focus-visible .reel{animation:sway 2.6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.5deg)}to{transform:rotate(2deg) translateY(2px)}}
.tape .np{position:absolute;left:58%;top:-26px;font-family:'Gaegu','Songti SC','STSong','SimSun','Noto Serif SC','Source Han Serif SC',cursive;font-size:18px;color:var(--muted);white-space:nowrap;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.tape:hover .np,.tape:focus-visible .np{opacity:1;transform:none;animation:bob 1.6s ease-in-out .3s infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-4deg)}}
</style>

<body>
<div id="dc-root"></div>
<template id="dc-template">
<div class="{{theme}}" style="min-height: 100vh; background: var(--paper); color: var(--ink); font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; transition: background .6s ease, color .6s ease; position: relative">

<!-- NAV -->
<header style="max-width: 1240px; margin: 0 auto; padding: 24px 24px 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" aria-label="{{t.nav.home}}" style="text-decoration: none; display: flex; align-items: center; padding: 4px 0"><img src="assets/site/f263d74ed1eebd543953fc578079680c.webp" alt="Shan, Qinglan" style="display: block; height: 58px; width: auto"></a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px"><a class="navlink" href="#about">{{t.nav.about}}</a><a class="navlink" href="gallery.html">{{t.nav.gallery}}</a><a class="navlink" href="xr-lab.html">{{t.nav.xrlab}}</a><a class="navlink" href="research.html">{{t.nav.research}}</a><button class="navlink lang" onClick="{{toggleLang}}" aria-label="{{t.nav.langLabel}}">{{t.nav.lang}}</button></nav>
</header>

<!-- HERO -->


<!-- PRIZE COLLECTION -->
<sc-if value="{{prizeOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px">
<button aria-label="Close awards" onClick="{{closePrize}}" style="position: absolute; inset: 0; border: 0; background: var(--veil); cursor: pointer"></button>
<div class="sheet paper" role="dialog" aria-label="Prize collection">
<div style="position: relative; flex: 1; display: flex; flex-direction: column; gap: clamp(10px, 1.2vw, 18px)">
<p style="margin: 0; font-size: clamp(12px, 1vw, 15px); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #B23A26">{{t.prize.kicker}}</p>
<h2 style="margin: 0; font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-weight: 400; font-size: clamp(26px, 2.2vw, 34px); line-height: 1.1">{{t.prize.title}}</h2>
<ul class="awards">
<sc-for list="{{awards}}" as="w" hint-placeholder-count="3">
<li><span style="flex: 0 0 auto; font-size: clamp(13px, 1vw, 15px); font-weight: 600; color: #5C564C">{{w.year}}</span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-size: clamp(16px, 1.25vw, 20px); font-weight: 400; color: #22201C">{{w.name}}</span><span style="font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-size: clamp(13px, 1vw, 15px); font-weight: 300; color: #5C564C">{{w.org}}</span></span></li>
</sc-for>
</ul>
<button onClick="{{closePrize}}" style="align-self: flex-end; margin-top: auto; min-height: 44px; padding: 0 18px; border: 2px solid #22201C; color: #22201C; background: transparent; border-radius: 999px; font-family: 'Gaegu', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', cursive; font-size: 20px; cursor: pointer">{{t.prize.close}}</button>
</div>
</div>
</div>
</sc-if>

<!-- PAPER BALL DETAIL OVERLAY -->
<sc-if value="{{hasActive}}" hint-placeholder-val="{{ false }}">
<div style="position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px">
<button aria-label="Close note" onClick="{{close}}" style="position: absolute; inset: 0; border: 0; background: var(--veil); cursor: pointer"></button>
<div class="sheet paper" role="dialog" aria-label="{{active.title}}">
<div style="position: relative; flex: 1; display: flex; flex-direction: column; gap: clamp(8px, 1.2vw, 18px)">
<p style="margin: 0; font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-size: clamp(12px, 1vw, 15px); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #B23A26">{{active.tag}}</p>
<h2 style="margin: 0; font-family: 'Gaegu', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', cursive; font-weight: 700; font-size: clamp(30px, 2.6vw, 44px); line-height: 1; text-wrap: balance">{{active.title}} <span style="white-space: nowrap; display: inline-block; font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-size: clamp(20px, 1.6vw, 26px); font-weight: 400; color: #5C564C">{{active.sub}}</span></h2>
<p style="margin: 0; font-family: 'Gaegu', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', cursive; font-size: clamp(18px, 1.5vw, 24px); line-height: 1.35; text-wrap: pretty">{{active.note}}</p>
<sc-if value="{{active.note2}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-family: 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-weight: 300; font-size: clamp(16px, 1.3vw, 20px); line-height: 1.5">{{active.note2}}</p>
</sc-if>
<sc-if value="{{active.link}}" hint-placeholder-val="{{ false }}">
<a href="{{active.link}}" style="align-self: flex-start; font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-size: 14px; padding: 10px 0">{{active.linkLabel}} →</a>
</sc-if>
<button onClick="{{close}}" style="align-self: flex-end; margin-top: auto; min-height: 44px; padding: 0 18px; border: 2px solid #22201C; color: #22201C; background: transparent; border-radius: 999px; font-family: 'Gaegu', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', cursive; font-size: 20px; cursor: pointer">{{t.note.close}}</button>
</div>
</div>
</div>
</sc-if>

        }
        for (let i = 0; i < n; i += 1) d[i] = d[i] / (peak || 1) * 0.8;
        this.purrBuf = buf;
      }
      const src = ac.createBufferSource(); src.buffer = this.purrBuf;
      const g = ac.createGain(); g.gain.value = 0.6;
      src.connect(g); g.connect(ac.destination); src.start();
    } catch (e) {}
  }
  renderVals() {
    const CUP = 'assets/site/224fedc880c0aabea1948ad07c97bdd9.webp';
    const L = this.state.lang === 'zh' ? 'zh' : 'en';
    const t = this.i18n()[L] || {};
    const other = this.i18n()[L === 'zh' ? 'en' : 'zh'] || {};
    const tn = t.note || {}; const on = other.note || {};
    const notes = {};
    ['cat', 'book', 'badminton', 'snowboard', 'chili', 'rnb', 'tennis', 'me', 'tea'].forEach((k) => {
      const n = tn[k] || {}; const o = on[k] || {};
      notes[k] = { tag: n.tag || '', title: n.title || '', sub: k === 'me' ? '' : (o.title || ''), note: n.text || '',
        note2: k === 'me' && L === 'en' ? (o.text || '') : '', link: k === 'me' ? 'mailto:qinglan.shan@epfl.ch' : '', linkLabel: n.link || '' };
    });
    const open = {};
    Object.keys(notes).forEach((k) => { open[k] = () => { if (k === 'cat') this.purr(); this.setState({ active: k }); }; });
    const active = this.state.active ? notes[this.state.active] : { tag: '', title: '', sub: '', note: '', note2: '', link: '', linkLabel: '' };
    const night = this.state.night;
    const fonts = { 'Caprasimo': "'Caprasimo', serif", 'Gochi Hand': "'Gochi Hand', cursive", 'Bagel Fat One': "'Bagel Fat One', sans-serif", 'Fraunces': "'Fraunces', serif" };
    return {
      t,
      purr: () => this.purr(),
      toggleLang: () => this.toggleLang(),
      heroSize: L === 'zh' ? 'clamp(28px, 2.8vw, 38px)' : 'clamp(56px, 7vw, 96px)',
      nameFont: fonts[this.props.nameFont ?? 'Caprasimo'] || fonts['Caprasimo'],
      open,
      active,
      prizeOpen: this.state.prize,
      openPrize: () => this.setState({ prize: true }),
      closePrize: () => this.setState({ prize: false }),
      // awards: content/home.md (award.1, award.2 ...)
      awards: this.rows(t.award).map(([year, name, org]) => ({ year, name, org: org || '' })),
      hasActive: !!this.state.active,
      close: () => this.setState({ active: null }),
      theme: night ? 'night' : 'day',
      toggleNight: () => { this.sfx('lamp'); this.setNight(!night); },
      lampSrc: night ? 'assets/site/f278cf13e9f353ff1d06e6449632811e.webp' : 'assets/site/b361dddda7f288be160201de03407a48.webp',
      glowClass: night ? 'glow' : '',
      lampPressed: night ? 'true' : 'false',
      lampLabel: night ? 'Turn the lamp off — day mode' : 'Turn the lamp on — night mode',
      lampHint: night ? (t.lamp || {}).toDay : (t.lamp || {}).toNight,
      shoot: () => this.shoot(),
      sfx: { tennis: () => this.sfx('tennis'), badminton: () => this.sfx('badminton'), book: () => this.sfx('book'), tea: () => this.sfx('tea'), snow: () => this.sfx('snow'), phone: () => this.sfx('phone') },
      cupSrc: CUP,
      musicOn: () => this.startMusic(),
      musicOff: () => this.stopMusic(false),
      flashClass: this.state.flash ? 'flash' : ''
    };
  }
}
