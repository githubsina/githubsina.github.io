<style>
body{margin:0; background-color: #FEFDFB; }
a{color:var(--ink)}a:hover{color:var(--accent)}
.day{--paper:#F3EDE1;--ink:#22201C;--muted:#5C564C;--desk:#EBE3D3;--card:#FBF8F1;--accent:#B23A26;--veil:rgba(243,237,225,.82)}
.night{--paper:#171513;--ink:#EEE7D7;--muted:#B3AA98;--desk:#221F1B;--card:#2B2722;--accent:#E8775C;--veil:rgba(15,14,12,.8)}
.glow{background:radial-gradient(circle,rgba(255,214,140,.55) 0%,rgba(255,200,120,.18) 38%,transparent 68%);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.8}}
.cam .af{opacity:0}
.cam:hover .af,.cam:focus-visible .af{animation:af .45s steps(2) 2 both}
@keyframes af{0%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
.flash{position:absolute;inset:-8%;border-radius:12px;background:#FFFFFF;animation:flash .25s ease-out both;pointer-events:none}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.stk{position:absolute;background:none;border:0;padding:0;cursor:pointer;transform:rotate(var(--r));transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.stk img{display:block;width:100%;height:auto;filter:drop-shadow(2px 4px 0 rgba(34,32,28,.2))}
.stk svg{display:block;width:100%;height:auto;filter:drop-shadow(2px 3px 0 rgba(34,32,28,.18))}
.stk:hover,.stk:focus-visible{transform:rotate(calc(var(--r) + 5deg)) scale(1.07);z-index:5}
.stk:focus-visible{outline:2px dashed #B23A26;outline-offset:6px}
.card{transition:transform .25s ease}
.card:hover{transform:translateY(-6px) rotate(0deg)!important}
.ph{background-color:#E7DFCF;background-image:repeating-linear-gradient(-45deg,rgba(34,32,28,.07) 0 2px,transparent 2px 10px)}
.spin{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sheet{animation:unfold .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes unfold{0%{transform:scale(.12) rotate(-60deg);opacity:.4}70%{transform:scale(1.03) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(-1.5deg)}}
.wob{animation:wob 3s ease-in-out infinite}
@keyframes wob{50%{transform:translateY(-4px) rotate(2deg)}}
.navlink{text-decoration:none;font-family: 'Instrument Sans', sans-serif;font-size:14px;letter-spacing:.04em;padding:10px 4px;border-bottom:2px solid transparent}
.navlink:hover{border-bottom-color:#B23A26}
.photo-tag{position:absolute;font-family:'Gaegu',cursive;font-weight:700;font-size:20px;text-decoration:none;color:var(--ink);background:var(--card);padding:4px 12px;box-shadow:2px 3px 0 rgba(34,32,28,.15);white-space:nowrap}
.photo-tag:hover{color:#B23A26}
.stk>img{position:relative}
/* notebook desk + lamp light */
.notebook{position:absolute;left:-6%;top:3%;width:112%;max-width:none;transform:rotate(-5deg);filter:drop-shadow(4px 10px 14px rgba(34,32,28,.22));pointer-events:none;user-select:none}
.light{position:absolute;inset:-6% -10% -10% -8%;pointer-events:none;z-index:4;transition:opacity .8s ease, background .8s ease}
.day .light{background:radial-gradient(circle at 78% 64%, rgba(255,222,160,.42) 0%, rgba(255,214,140,.16) 22%, rgba(255,214,140,0) 46%);mix-blend-mode:soft-light}
.night .light{background:radial-gradient(circle at 78% 64%, rgba(255,206,130,.30) 0%, rgba(255,190,110,.12) 18%, rgba(23,21,19,.2) 34%, rgba(23,21,19,.66) 60%, rgba(23,21,19,.82) 100%)}
.stk:hover,.stk:focus-visible{z-index:6}
/* cassette reels */
.tape>img.hub{position:absolute;width:10.842%;height:auto;filter:none;pointer-events:none}
.tape:hover>img.hub,.tape:focus-visible>img.hub,.tape:active>img.hub{animation:spin 1.1s linear infinite}
/* paper note */
.paper{position:relative;width:clamp(300px,44vw,720px);max-width:100%;min-height:calc(clamp(300px,44vw,720px) * 415 / 583);background:url(assets/site/4dbe0b6f91adfcab60228e6a1f78e16b.webp) center/100% 100% no-repeat;padding:clamp(40px,9%,96px) 11% clamp(36px,8%,84px) 10.5%;box-sizing:border-box;color:#22201C;display:flex;filter:drop-shadow(0 14px 24px rgba(34,32,28,.25))}
/* telephone */
.phone{position:relative;flex:0 0 58px;align-self:flex-start;margin-top:-6px;background:none;border:0;padding:0;cursor:pointer}
.phone .drop{display:block;animation:drop 1.5s cubic-bezier(.25,1.35,.45,1) .2s both}
@keyframes drop{from{transform:translateY(-110vh)}to{transform:none}}
.phone .spring{display:block;position:relative}
.phone .cord{position:absolute;left:calc(44% - 11px);bottom:calc(100% - 6px);width:22px;height:960px;overflow:visible}
.phone .hand{display:block;transform-origin:44% 2%}
.phone .hand img{display:block;width:58px;height:auto;filter:drop-shadow(2px 6px 6px rgba(34,32,28,.25))}
.phone:hover .spring,.phone:focus-visible .spring{animation:boing 1.5s cubic-bezier(.3,.6,.4,1)}
@keyframes boing{0%{transform:none}18%{transform:translateY(-54px)}40%{transform:translateY(16px)}58%{transform:translateY(-8px)}76%{transform:translateY(4px)}100%{transform:none}}
.phone:hover .hand,.phone:focus-visible .hand{animation:swing 1.9s ease-out}
@keyframes swing{0%{transform:none}14%{transform:rotate(-15deg)}32%{transform:rotate(13deg)}50%{transform:rotate(-8deg)}68%{transform:rotate(5deg)}84%{transform:rotate(-2deg)}100%{transform:none}}
.phone .waves path{opacity:0;animation:wave 2.4s ease-out infinite}
.phone .waves path:nth-child(2){animation-delay:.3s}
.phone .waves path:nth-child(3){animation-delay:.6s}
@keyframes wave{0%{opacity:0;transform:translateX(-4px)}30%{opacity:.8}100%{opacity:0;transform:translateX(6px)}}
.phone:focus-visible{outline:2px dashed #B23A26;outline-offset:6px}
@media (min-width: 1360px){.phone{margin-left:-84px;margin-right:4px}}
.prize{align-self:flex-start;background:none;border:0;padding:0;cursor:pointer;width:170px;transform:rotate(-8deg);transition:transform .35s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(2px 4px 0 rgba(34,32,28,.15))}
.prize img{display:block;width:100%;height:auto}
.prize:hover,.prize:focus-visible{transform:rotate(4deg) scale(1.08)}
.prize:focus-visible{outline:2px dashed #B23A26;outline-offset:6px}
.awards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:clamp(6px,.7vw,10px)}
.awards li{display:grid;grid-template-columns:5.5em 1fr;gap:14px;align-items:baseline;border-bottom:1.5px dashed rgba(34,32,28,.3);padding-bottom:6px}
.poke{position:absolute;left:96px;top:626px;z-index:5;margin:0;display:flex;align-items:flex-start;gap:6px;font-family:'Gaegu',cursive;font-size:22px;font-weight:700;color:var(--muted);transform:rotate(-2deg);white-space:nowrap}
@media (prefers-reduced-motion: reduce){.prize{transition:none}}
@media (prefers-reduced-motion: reduce){.phone .drop,.phone .spring,.phone .hand,.phone .waves path,.tape>img.hub{animation:none!important}.phone .waves path{opacity:.6}}
.tape .reel{position:absolute;left:0;top:0;width:100%;height:auto;overflow:visible;pointer-events:none;filter:none}
.tape .reel path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .7s ease-in}
.tape:hover .reel path,.tape:focus-visible .reel path{stroke-dashoffset:0;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.7,.3,1)}
.tape:hover .reel path:nth-child(2),.tape:focus-visible .reel path:nth-child(2){transition-delay:.25s}
.tape:hover .reel,.tape:focus-visible .reel{animation:sway 2.6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.5deg)}to{transform:rotate(2deg) translateY(2px)}}
.tape .np{position:absolute;left:58%;top:-26px;font-family:'Gaegu',cursive;font-size:18px;color:var(--muted);white-space:nowrap;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.tape:hover .np,.tape:focus-visible .np{opacity:1;transform:none;animation:bob 1.6s ease-in-out .3s infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-4deg)}}
</style>

<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: null, night: false, flash: false, prize: false };
  }
  componentDidMount() {
    try { if (window.localStorage.getItem('qs-theme') === 'night') this.setState({ night: true }); } catch (e) {}
  }
  componentWillUnmount() {
    this.stopMusic(true);
  }
  // Sound files live in the artifact's asset store. Fill in a assets/site/ url to switch a sound on.
  sound(kind) {
    const SOUNDS = {
      tennis: 'assets/site/cde13d69239484489f9dca4bd92b4615.mp4',
      badminton: 'assets/site/ac4d286e444b7770f3fe5ad967d47ef3.mp4',
      book: 'assets/site/effe7930e67672688ed8a4cb7de73dc2.mp4',
      tea: 'assets/site/b4597160965e6dcd24392336399fb378.mp4',
      snow: 'assets/site/7c9ddbe162e3630e0839e47136f0e470.mp4',
      lamp: 'assets/site/7f6ac5e4c9807fe33a5f99f7ce118cec.mp4',
      phone: '',
      music: 'assets/site/cff5993c7bb856fa7003520b7776b4d5.mp4'
    };
    const url = SOUNDS[kind];
    if (!url) return null;
    this.snd = this.snd || {};
    if (!this.snd[kind]) { try { const el = new Audio(url); el.preload = 'auto'; this.snd[kind] = el; } catch (e) { return null; } }
    return this.snd[kind];
  }
  sfx(kind) {
    const now = Date.now(); this.last = this.last || {};
    if (this.last[kind] && now - this.last[kind] < 600) return;
    this.last[kind] = now;
    const el = this.sound(kind); if (!el) return;
    // long recordings are cut short with a quick fade so a hover stays a hover
    const MAX = { tennis: 1.6, snow: 3.5, tea: 4.5 };
    this.cut = this.cut || {};
    clearInterval(this.cut[kind]);
    try {
      el.currentTime = 0; el.volume = 0.7; const r = el.play(); if (r && r.catch) r.catch(() => {});
      if (MAX[kind]) {
        const stopAt = MAX[kind];
        this.cut[kind] = setInterval(() => {
          if (el.paused) { clearInterval(this.cut[kind]); return; }
          if (el.currentTime > stopAt - 0.5) el.volume = Math.max(0, el.volume - 0.1);
          if (el.currentTime >= stopAt || el.volume <= 0) { el.pause(); clearInterval(this.cut[kind]); }
        }, 50);
      }
    } catch (e) {}
  }
  startMusic() {
    const el = this.sound('music'); if (!el) return;
    clearInterval(this.fadeT);
    try {
      el.loop = true; if (el.paused) el.volume = 0;
      const r = el.play(); if (r && r.catch) r.catch(() => {});
      this.fadeT = setInterval(() => { el.volume = Math.min(0.6, el.volume + 0.06); if (el.volume >= 0.6) clearInterval(this.fadeT); }, 50);
    } catch (e) {}
  }
  stopMusic(now) {
    const el = this.snd && this.snd.music; if (!el) return;
    clearInterval(this.fadeT);
    if (now) { el.pause(); return; }
    this.fadeT = setInterval(() => { el.volume = Math.max(0, el.volume - 0.05); if (el.volume <= 0) { clearInterval(this.fadeT); el.pause(); } }, 50);
  }
  setNight(night) {
    this.setState({ night });
    try { window.localStorage.setItem('qs-theme', night ? 'night' : 'day'); } catch (e) {}
  }
  shoot() {
    const now = Date.now();
    if (this.lastShot && now - this.lastShot < 1500) return;
    this.lastShot = now;
    setTimeout(() => this.setState({ flash: true }), 430);
    setTimeout(() => this.setState({ flash: false }), 700);
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = this.ac || new AC();
      const ac = this.ac;
      if (ac.state === 'suspended') ac.resume();
      const t = ac.currentTime + 0.02;
      const beep = (at) => {
        const o = ac.createOscillator(); const g = ac.createGain();
        o.type = 'square'; o.frequency.value = 2900;
        g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.05, at + 0.005);
        g.gain.setValueAtTime(0.05, at + 0.045); g.gain.linearRampToValueAtTime(0, at + 0.055);
        o.connect(g); g.connect(ac.destination); o.start(at); o.stop(at + 0.07);
      };
      const click = (at, dur, freq, vol) => {
        const len = Math.floor(ac.sampleRate * dur);
        const buf = ac.createBuffer(1, len, ac.sampleRate); const d = buf.getChannelData(0);
        for (let i = 0; i < len; i += 1) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
        const src = ac.createBufferSource(); src.buffer = buf;
        const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.9;
        const g = ac.createGain(); g.gain.value = vol;
        src.connect(f); f.connect(g); g.connect(ac.destination); src.start(at);
      };
      beep(t); beep(t + 0.1); beep(t + 0.2);
      click(t + 0.43, 0.045, 3800, 0.9); click(t + 0.5, 0.07, 1600, 0.6);
    } catch (e) {}
  }
  renderVals() {
    const CUP = 'assets/site/224fedc880c0aabea1948ad07c97bdd9.png';
    const notes = {
      cat: { tag: 'family · 家人', title: 'Mafia', zh: '黑包', note: 'Also known as Mafia. [Age, habits, favourite spot in the flat.]' },
      book: { tag: 'reading this month', title: 'Sleep', zh: '《眠》', note: 'Haruki Murakami. [Why this story stays with you.]' },
      home: { tag: 'hometown · 家乡', title: 'Zhangjiajie', zh: '张家界', note: 'Where I grew up: the stone pillars that inspired the floating mountains in Avatar.' },
      badminton: { tag: 'sport', title: 'Badminton', zh: '羽毛球', note: 'I played badminton at LUC (Lausanne University Club) and won women’s doubles and mixed matches for the club against the Rudi Team from Lausanne.' },
      snowboard: { tag: 'sport', title: 'Snowboarding', zh: '单板滑雪', note: 'Five years of snowboarding, free-riding on all mountain pistes.' },
      chili: { tag: 'kitchen', title: 'Chili', zh: '辣椒', note: 'A Hunan kid never cooks without it.' },
      rnb: { tag: 'music', title: 'R&B', zh: '节奏布鲁斯', note: '[Three songs on repeat.]' },
      tennis: { tag: 'sport', title: 'Tennis', zh: '网球', note: 'After I injured my shoulder, I switched from badminton to tennis.' },
      me: { tag: 'say hello', title: 'Hi, that’s me', zh: '', note: 'Thank you for being interested in me! Don’t forget to reach out!', note2: '谢谢你对我感兴趣！请和我联络吧！', link: 'mailto:qinglan.shan@epfl.ch', linkLabel: 'Contact: qinglan.shan@epfl.ch' },
      tea: { tag: 'ritual', title: 'Tea', zh: '茶', note: '[Which tea, and how you brew it.]' },
      coffee: { tag: 'ritual', title: 'Coffee', zh: '咖啡', note: '[How you take it.]' }
    };
    const open = {};
    Object.keys(notes).forEach((k) => { open[k] = () => this.setState({ active: k }); });
    const active = this.state.active ? notes[this.state.active] : { tag: '', title: '', zh: '', note: '', note2: '' };
    const night = this.state.night;
    const fonts = { 'Caprasimo': "'Caprasimo', serif", 'Gochi Hand': "'Gochi Hand', cursive", 'Bagel Fat One': "'Bagel Fat One', sans-serif", 'Fraunces': "'Fraunces', serif" };
    return {
      nameFont: fonts[this.props.nameFont ?? 'Caprasimo'] || fonts['Caprasimo'],
      open,
      active,
      prizeOpen: this.state.prize,
      openPrize: () => this.setState({ prize: true }),
      closePrize: () => this.setState({ prize: false }),
      // 获奖经历: from the CV. Add rows as { year, name, org }.
      awards: [
        { year: '2021', name: '清华大学“一二·九”辅导员郭明秋奖', org: '学业与学生工作兼顾，每年全体研究生中评选约 40 人' },
        { year: '2021', name: '清华大学优秀学生干部', org: '全校前 0.5%' },
        { year: '2019–2022', name: '清华大学校级二等奖学金', org: '清华大学 · 计算机科学与技术 硕士' },
        { year: '2019–2022', name: '清华大学先进研究生集体', org: '担任中法硕士项目班班长，带领班级获评' },
        { year: '2019', name: '四川省优秀毕业生', org: '省级' },
        { year: '2018', name: '国家奖学金', org: '全国本专科生获奖比例约 0.2%' },
        { year: '2015–2019', name: '成都理工大学最高奖学金', org: '连续三年' }
      ],
      hasActive: !!this.state.active,
      close: () => this.setState({ active: null }),
      theme: night ? 'night' : 'day',
      toggleNight: () => { this.sfx('lamp'); this.setNight(!night); },
      lampSrc: night ? 'assets/site/f278cf13e9f353ff1d06e6449632811e.png' : 'assets/site/b361dddda7f288be160201de03407a48.png',
      glowClass: night ? 'glow' : '',
      lampPressed: night ? 'true' : 'false',
      lampLabel: night ? 'Turn the lamp off — day mode' : 'Turn the lamp on — night mode',
      lampHint: night ? 'click for daylight' : 'click for night',
      shoot: () => this.shoot(),
      sfx: { tennis: () => this.sfx('tennis'), badminton: () => this.sfx('badminton'), book: () => this.sfx('book'), tea: () => this.sfx('tea'), snow: () => this.sfx('snow'), phone: () => this.sfx('phone') },
      cupSrc: CUP,
      musicOn: () => this.startMusic(),
      musicOff: () => this.stopMusic(false),
      flashClass: this.state.flash ? 'flash' : ''
    };
  }
}
</script>
