/* amblyopia figure, brought to life: a slow scan across the system, the two eyes' stimuli pulsing in turn */
.amb{position:relative;display:block;width:100%;aspect-ratio:2362 / 966;background:#FFFFFF}
.amb img{display:block;width:100%;height:100%}
.amb .lens{position:absolute;border-radius:50%;box-shadow:0 0 0 3px #B23A26,0 0 18px 4px rgba(178,58,38,.45);animation:ambpulse 1.8s ease-in-out infinite}
.amb .lens.r{animation-delay:.9s}

.amb .hz{position:absolute;padding:2px 7px;border-radius:999px;background:#B23A26;color:#FFFFFF;font-family:'Josefin Sans','Songti SC','STSong','SimSun','Noto Serif SC','Source Han Serif SC',sans-serif;font-size:clamp(9px,.8vw,12px);font-weight:600;white-space:nowrap;animation:ambpulse 1.8s ease-in-out infinite}
.amb .hz.r{animation-delay:.9s}
.amb .scan{position:absolute;top:1.5%;height:97%;border:3px solid #B23A26;border-radius:14px;box-sizing:border-box;animation:ambscan 9s cubic-bezier(.6,0,.3,1) infinite}

<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="min-height: 100vh; background: #F3EDE1; color: #22201C; font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif">
<header style="max-width: 1240px; margin: 0 auto; padding: 24px 24px 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" aria-label="{{t.nav.home}}" style="text-decoration: none; display: flex; align-items: center; padding: 4px 0"><img src="assets/site/f263d74ed1eebd543953fc578079680c.webp" alt="Shan, Qinglan" style="display: block; height: 58px; width: auto"></a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px"><a class="navlink" href="index.html#about">{{t.nav.about}}</a><a class="navlink" href="gallery.html">{{t.nav.gallery}}</a><a class="navlink" href="xr-lab.html" style="border-bottom-color: #22201C">{{t.nav.xrlab}}</a><a class="navlink" href="research.html">{{t.nav.research}}</a><button class="navlink lang" onClick="{{toggleLang}}" aria-label="{{t.nav.langLabel}}">{{t.nav.lang}}</button></nav>
</header>

<!-- project switcher -->
<div style="max-width: 1080px; margin: 0 auto; padding: 40px 24px 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<a href="xr-lab.html" style="font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-size: 18px; text-decoration: none; padding: 10px 0; letter-spacing: -.01em">{{t.proj.all}}</a>
<nav aria-label="Projects" style="display: flex; gap: 4px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button class="tab" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" aria-label="{{t.title}}" style="color: {{t.color}}">{{t.no}}
<sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" viewBox="0 0 60 40" preserveAspectRatio="none" style="position: absolute; inset: 2px -2px; width: calc(100% + 4px); height: calc(100% - 4px); pointer-events: none"><path d="M12 6 C 34 0, 56 6, 56 20 C 56 34, 30 38, 14 34 C 2 30, 2 14, 22 8" fill="none" stroke="#B23A26" stroke-width="2.2" stroke-linecap="round"></path></svg>
</sc-if>
</button>
</sc-for>
</nav>
</div>

<!-- TITLE -->
<section class="in" style="max-width: 1080px; margin: 0 auto; padding: 40px 24px 0; display: flex; flex-direction: column; gap: 14px">
<p class="lbl" style="margin: 0; color: #B23A26">{{p.venue}}</p>
<h1 style="margin: 0; font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-weight: 600; font-size: clamp(42px, 7vw, 74px); line-height: 1.02; max-width: 18ch; letter-spacing: -.01em">{{p.title}}</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5C564C; max-width: 72ch">{{p.paper}}</p>
<p style="margin: 8px 0 0; font-size: 20px; line-height: 1.55; color: #3A3730; max-width: 58ch">{{p.lede}}</p>
<dl style="margin: 14px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px 32px; border-top: 1.5px dashed #9A9284; padding-top: 20px">
<sc-for list="{{p.meta}}" as="m" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 4px"><dt class="lbl">{{m.k}}</dt><dd style="margin: 0; font-size: 15px; line-height: 1.45">{{m.v}}</dd></div>
</sc-for>
</dl>
</section>

    ];
    const L = this.state.lang === 'zh' ? 'zh' : 'en';
    const t = this.i18n()[L] || {};
    const words = (k) => (t.projects || {})[k] || {};
    this.keys = projects.map((x) => x.key);
    const i = Math.min(Math.max(this.state.p, 0), projects.length - 1);
    const x = projects[i];
    const w = words(x.key);
    const two = (r) => [r[0] || '', r.slice(1).join(' | ')];
    this.docTitle = (w.title || '') + (L === 'zh' ? ' · 单晴岚' : ' · Qinglan Shan');
    const pad = (n) => String(n).padStart(2, '0');
    const go = (k) => { this.setState({ p: k }); try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {} };
    return {
      t,
      toggleLang: () => this.toggleLang(),
      tabs: projects.map((y, k) => ({ no: pad(k + 1), title: words(y.key).title || '', on: k === i, pressed: k === i ? 'true' : 'false', color: k === i ? '#22201C' : '#5C564C', pick: () => go(k) })),
      p: {
        venue: w.venue || '', title: w.title || '', paper: w.paper || '', lede: w.lede || '',
        fig: w.fig || {}, heroVideo: x.hero.video ? B + x.hero.video : '', diagram: !!x.hero.diagram, amb: !!x.hero.amb, heroCap: w.caption || '',
        meta: this.rows(w.meta).map((r) => { const [k, v] = two(r); return { k, v }; }),
        stats: this.rows(w.stat).map((r) => { const [v, k] = two(r); return { v, k }; }), hasStats: this.rows(w.stat).length > 0,
        story: this.rows(w.story).map((r) => { const [h, tx] = two(r); return { h, t: tx }; }),
        threads: this.rows(w.thread).map((r, k) => { const [h, tx] = two(r); const m = x.threads[k] || {}; const caps = this.rows(w.bubble); return { no: pad(k + 1), h, t: tx, cls: (m.flow || m.panels) ? 'stack' : '', flow: !!m.flow, img: m.img ? B + m.img : '', alt: m.alt || '', hasPanels: !!m.panels, panels: (m.panels || []).map((id, j) => ({ src: B + id, cap: caps[j] ? caps[j].join(' | ') : '' })), quote: '', quoteBy: '' }; }),
        hasThreads: this.rows(w.thread).length > 0,
        quote: w.quote || '', quoteBy: w.quoteBy || '',
        gallery: x.gallery.map(([id, wide, isVideo], k) => ({ cap: this.rows(w.gallery)[k] ? this.rows(w.gallery)[k].join(' | ') : '', cls: wide ? 'wide' : '', video: isVideo ? B + id : '', src: isVideo ? '' : B + id })),
        hasGallery: x.gallery.length > 0,
        links: x.links.map((href, k) => ({ label: this.rows(w.link)[k] ? this.rows(w.link)[k].join(' | ') : href, href }))
      },
      nextTitle: words(projects[(i + 1) % projects.length].key).title || '',
      goNext: () => go((i + 1) % projects.length)
    };
  }
}
</script>
