<style>
body{margin:0;background:#F3EDE1}
a{color:#22201C}a:hover{color:#B23A26}
.navlink{text-decoration:none;font-family:'Instrument Sans',sans-serif;font-size:14px;font-weight:500;letter-spacing:.04em;padding:10px 4px;border-bottom:2px solid transparent}
.navlink:hover{border-bottom-color:#B23A26}
.lbl{font-family:'Instrument Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#5C564C}
.shot{position:relative;margin:0;background:#FBF8F1;border:1.5px solid #E6DECF;border-radius:22px;padding:16px}
.frame{display:block;border-radius:12px;overflow:hidden;background:#FFFFFF}
.frame img{display:block;width:100%;height:auto}
.frame.vid{aspect-ratio:16 / 9}
.tab{background:none;border:0;cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:14px;font-weight:600;color:#5C564C;padding:10px 8px;min-height:44px;position:relative}
.tab:hover{color:#B23A26}
.tab:focus-visible{outline:2px dashed #B23A26;outline-offset:2px}
.in{animation:in .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.lnk{font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:15px;padding:10px 0}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px;align-items:start}
.gal .wide{grid-column:1 / -1}
.thread{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:40px;align-items:center;padding:28px;background:#FBF8F1;border:1.5px solid #E6DECF;border-radius:26px}
.wf .arrow{stroke-dasharray:6 8;animation:wfdash 1s linear infinite}
@keyframes wfdash{to{stroke-dashoffset:-28}}
.wf .pin{transform-box:fill-box;transform-origin:50% 100%;animation:wfpin 2.4s ease-in-out infinite}
@keyframes wfpin{0%,100%{transform:translateY(-10px)}45%,70%{transform:none}}
@media (max-width:820px){.gal,.thread{grid-template-columns:1fr}.gal .wide{grid-column:auto}}
/* AI-authoring loop: upload -> draft -> check -> publish (10 s) */
.ai2 g,.ai2 circle,.ai2 path{transform-box:fill-box;transform-origin:center}
.ai2 .f{animation:ai2f 10s ease-in-out infinite}.ai2 .f2{animation-delay:.15s}.ai2 .f3{animation-delay:.3s}
@keyframes ai2f{0%{opacity:0;transform:translateY(-20px)}6%,14%{opacity:1;transform:none}26%{opacity:0;transform:translateX(220px) scale(.35)}100%{opacity:0;transform:translateX(220px) scale(.35)}}
.ai2 .w{animation:ai2dash 1s linear infinite,ai2w1 10s linear infinite}.ai2 .w2{animation:ai2dash 1s linear infinite,ai2w2 10s linear infinite}
@keyframes ai2dash{to{stroke-dashoffset:-32}}
@keyframes ai2w1{0%,10%{opacity:0}14%,34%{opacity:1}40%,100%{opacity:0}}
@keyframes ai2w2{0%,36%{opacity:0}40%,58%{opacity:1}64%,100%{opacity:0}}
.ai2 .ring{animation:ai2spin 6s linear infinite,ai2ring 10s ease-in-out infinite}
@keyframes ai2spin{to{transform:rotate(360deg)}}
@keyframes ai2ring{0%,16%{opacity:.15}24%,44%{opacity:1}52%,100%{opacity:.15}}
.ai2 .llm{animation:ai2llm 10s ease-in-out infinite}
@keyframes ai2llm{0%,22%{transform:none}28%{transform:scale(1.06)}34%{transform:scale(.98)}40%,100%{transform:none}}
.ai2 .ed,.ai2 .cn{animation:ai2ed 10s ease-out infinite}
@keyframes ai2ed{0%,34%{opacity:0;transform:translateY(10px)}40%,94%{opacity:1;transform:none}100%{opacity:0}}
.ai2 .ln{stroke-dasharray:140;animation:ai2ln 10s ease-out infinite}
@keyframes ai2ln{0%,40%{stroke-dashoffset:140}58%,94%{stroke-dashoffset:0}100%{stroke-dashoffset:140}}
.ai2 .n{opacity:0;animation:ai2n 10s ease-out infinite}
.ai2 .n1{animation-delay:.3s}.ai2 .n2{animation-delay:.6s}.ai2 .n3{animation-delay:.9s}.ai2 .n4{animation-delay:1.2s}.ai2 .n5{animation-delay:1.5s}
@keyframes ai2n{0%,40%{opacity:0;transform:translateY(8px)}45%,92%{opacity:1;transform:none}97%,100%{opacity:0}}
.ai2 .hl{animation:ai2hl 10s ease-out infinite}
@keyframes ai2hl{0%,66%{stroke:#22201C;stroke-width:2}70%,90%{stroke:#B23A26;stroke-width:3}96%,100%{stroke:#22201C;stroke-width:2}}
.ai2 .cur{opacity:0;animation:ai2cur 10s ease-in-out infinite}
@keyframes ai2cur{0%,58%{opacity:0;transform:translate(60px,70px)}62%{opacity:1;transform:translate(60px,70px)}68%{transform:none}70%{transform:scale(.85)}72%,80%{opacity:1;transform:none}86%,100%{opacity:0}}
.ai2 .chip{opacity:0;animation:ai2chip 10s ease-out infinite}.ai2 .c2{animation-delay:.25s}.ai2 .c3{animation-delay:.6s}
@keyframes ai2chip{0%,70%{opacity:0;transform:scale(.3)}74%,92%{opacity:1;transform:none}97%,100%{opacity:0}}
.ai2 .fly{opacity:0;animation:ai2fly 10s ease-in-out infinite}
@keyframes ai2fly{0%,78%{opacity:0;transform:translateY(-70px) scale(.6)}82%{opacity:1}88%,95%{opacity:1;transform:none}100%{opacity:0}}
.ai2 .hmd{animation:ai2hmd 10s ease-in-out infinite}
@keyframes ai2hmd{0%,80%{opacity:.35}86%,95%{opacity:1}100%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.ai2 *{animation:none!important;opacity:1!important}}
/* amblyopia figure, brought to life: a slow scan across the system, the two eyes' stimuli pulsing in turn */
.amb{position:relative;display:block;width:100%;aspect-ratio:2362 / 966;background:#FFFFFF}
.amb img{display:block;width:100%;height:100%}
.amb .lens{position:absolute;border-radius:50%;box-shadow:0 0 0 3px #B23A26,0 0 18px 4px rgba(178,58,38,.45);animation:ambpulse 1.8s ease-in-out infinite}
.amb .lens.r{animation-delay:.9s}
@keyframes ambpulse{0%,100%{opacity:.1}50%{opacity:1}}
.amb .hz{position:absolute;padding:2px 7px;border-radius:999px;background:#B23A26;color:#FFFFFF;font-family:'Instrument Sans',sans-serif;font-size:clamp(9px,.8vw,12px);font-weight:600;white-space:nowrap;animation:ambpulse 1.8s ease-in-out infinite}
.amb .hz.r{animation-delay:.9s}
.amb .scan{position:absolute;top:1.5%;height:97%;border:3px solid #B23A26;border-radius:14px;box-sizing:border-box;animation:ambscan 9s cubic-bezier(.6,0,.3,1) infinite}
@keyframes ambscan{0%,28%{left:.4%;width:32.6%}34%,61%{left:33.8%;width:24.4%}67%,94%{left:58.4%;width:41.2%}100%{left:.4%;width:32.6%}}
@media (prefers-reduced-motion: reduce){.amb .lens,.amb .hz,.amb .scan{animation:none}.amb .scan{display:none}}
@media (prefers-reduced-motion: reduce){.in,.wf *{animation:none}}
</style>

<span style="font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 45px; line-height: 1.02; color: #B23A26; letter-spacing: -.01em">{{th.no}}</span>
<h3 style="margin: 0; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 27px; line-height: 1; letter-spacing: -.01em">{{th.h}}</h3>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3A3730">{{th.t}}</p>
<sc-if value="{{th.quote}}" hint-placeholder-val="{{ false }}">
<p style="margin: 6px 0 0; font-family: 'Instrument Sans', sans-serif; font-size: 21px; line-height: 1.2; letter-spacing: -.01em">“{{th.quote}}” <span class="lbl" style="font-family: 'Instrument Sans', sans-serif">{{th.quoteBy}}</span></p>

<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { p: 0 };
  }
  componentDidMount() {
    // XR Lab cards link here as project.html#mixedlab etc.
    try {
      const key = (window.location.hash || '').replace('#', '');
      const i = this.keys.indexOf(key);
      if (i >= 0) this.setState({ p: i });
    } catch (e) {}
    this.playLoops();
  }
  componentDidUpdate() { this.playLoops(); }
  playLoops() {
    try { document.querySelectorAll('video[data-loop]').forEach((v) => { v.muted = true; const p = window.__lazyPlay ? window.__lazyPlay(v) : v.play(); if (p && p.catch) p.catch(() => {}); }); } catch (e) {}
  }
  renderVals() {
    const B = 'assets/site/';
    // hero: video blob, 'diagram' (AI loop) or 'amb' (animated figure). gallery: [caption, blob, wide?, isVideo?]
    const projects = [
      { key: 'embodied', venue: 'In progress · fall 2026', title: 'Embodied MR in the cleanroom',
        paper: 'A new study, running this semester. Details will follow once it is published.',
        lede: 'Students reach into holograms of the photolithography process, from the wafer to the mask to the light, and learn it with their hands.',
        meta: [['Year', '2026 – now'], ['Role', 'Lead · design, development, study'], ['Tools', 'HoloLens 2 · Unity · embodied interaction'], ['Setting', 'EPFL cleanroom (CMi)']],
        hero: { video: '2ed66dd3faa9054cb8c2b788b83a3e51.mp4' }, heroCap: 'Real footage from the fall 2026 sessions, seen through the headset.',
        stats: [],
        story: [['coming soon', 'The study is still running, so most of it stays under wraps for now. The question: does learning with your body, not just your eyes, help students understand what happens on the wafer?']],
        threads: [], quote: '', quoteBy: '', gallery: [], links: [] },
      { key: 'aiauthor', venue: 'In progress · 2025 –', title: 'AI-assisted MR authoring',
        paper: 'Ongoing research. Early user study done; details to follow once published.',
        lede: 'Writing MR training by hand takes time most teachers don’t have. I’m exploring how a large language model can turn the documents labs already keep into draft MR training, with the teacher staying in charge.',
        meta: [['Year', '2025 – now'], ['Role', 'Lead · tool design, development, user study'], ['Tools', 'LLM pipeline · web editor · HoloLens 2 · Unity'], ['Status', 'Early validation with teaching staff done']],
        hero: { diagram: true }, heroCap: 'The idea: lab documents go in, an LLM drafts the steps, a teacher checks them and adds media, and the training opens on the headset.',
        stats: [],
        story: [
          ['the idea', 'Cleanrooms already have process flows, run cards and machine manuals. Instead of rebuilding them as MR content by hand, the tool reads them and drafts step-by-step training. The teacher reviews it in a web editor and publishes it to the headset in one go.'],
          ['why it matters', 'It sits where AI meets engineering education: authoring cost is one of the main reasons MR stays in pilots. If AI handles the first draft and people keep the judgment, more courses can use hands-on MR training.']
        ],
        threads: [], quote: '', quoteBy: '', gallery: [], links: [] },
      { key: 'cleanroom', venue: 'CHI EA 2026 · Barcelona', title: 'MR-assisted cleanroom training',
        paper: 'From Apprenticeship to Autonomy: Mixed Reality-Assisted Training in a Cleanroom by a Hybrid Authoring Workflow',
        lede: 'Cleanroom training still runs on one instructor, one student, one machine. This system lets instructors author MR training once, so novices can work through photolithography on their own.',
        meta: [['Year', '2024 – 2026'], ['Role', 'First author · system design, study, analysis'], ['Tools', 'HoloLens 2 · MRTK · Unity · web authoring tool'], ['Team', 'Qinglan Shan, Manu Kapur, Jürgen Brugger']],
        hero: { video: '1337771e73364f03578d50deda5e4f57.mp4' }, heroCap: 'A student works the spin coater with MR guidance, in a real microfabrication course.',
        stats: [['15', 'participants across two semesters'], ['78.6', 'SUS: “good” to “excellent” usability'], ['2', 'modules written by instructors, no code']],
        story: [['the problem', 'Training in semiconductor cleanrooms relies on one-to-one “master–apprentice” teaching that is hard to scale, and building MR content usually needs programming skills most educators don’t have.']],
        threads: [
          { no: '01', h: 'the workflow', t: 'Instructors build the training in a web editor, without code: steps, 3D models, videos, quizzes. Then they pin each step to the real equipment, in the office or on site, and students follow it on HoloLens 2.', flow: true },
          { no: '02', h: 'the invisible bubble', t: 'Students stopped imitating the teacher and worked on their own, but each one ended up inside a bubble of focus, talking less to peers. We suggest ways to step out of it when collaboration matters.', img: '0c91e6106534b47dc4c778e4932a9f9d.webp', alt: 'Five interaction patterns around the invisible bubble', quote: 'We are all in our own world.', quoteBy: 'P1' }
        ],
        quote: '', quoteBy: '', gallery: [],
        links: [['Paper (ACM DOI)', 'https://doi.org/10.1145/3772363.3798988']] },
      { key: 'mixedlab', venue: 'SEFI 2024 · ICLS 2025', title: 'MixedLAB',
        paper: 'MixedLAB: Mixed Reality to Teach Students Experimental Knowledge in Microfabrication · Mixed-reality training in a cleanroom to bridge intentional learning and actual learning',
        lede: 'Microfabrication happens at a scale nobody can see. MixedLAB lays molecules, checklists and feedback over the real equipment, so students can see why a step works while their hands are busy.',
        meta: [['Year', '2023 – 2025'], ['Role', 'First author · co-design, development, studies'], ['Tools', 'HoloLens 2 · MRTK · Unity · Blender'], ['Team', 'Qinglan Shan, Julia Chatain, Fan Wang, Arnaud Bertsch, Manu Kapur, Jürgen Brugger']],
        hero: { video: '1427da86f6e6fd51697440a522e8ba24.mp4' }, heroCap: 'First-person view: a student ticks off the spin-coating checklist while working at the bench.',
        stats: [['8 / 12', 'course students took part'], ['21', 'days until the delayed hands-on test'], ['4', 'learning-science design principles']],
        story: [
          ['the problem', 'Automated equipment leaves little hands-on engagement, and students get buried in procedural steps, so the concepts teachers design for get lost.'],
          ['what I built', 'Co-designed with teachers and students: scan a QR code at a station and the matching module opens, with 3D molecules, step checklists, instant feedback and small rewards. Teachers edit it without Unity.'],
          ['what we learned', 'Students found it natural and fun, and liked learning at their own pace. MR’s extra questions pulled their attention back to the concepts behind each step.']
        ],
        threads: [], quote: 'The best thing for me is I can learn on my own pace.', quoteBy: 'Participant P4, SEFI 2024 interviews',
        gallery: [['Hands on the wafer box, seen through the headset', '29c26de86dba08a00df6c6457f19780b.mp4', false, true], ['Inside MixedLAB: molecules, checklists, feedback, graphics with text', '8d20ac742f80501725507c8477bb8e66.webp', false, false]],
        links: [['SEFI 2024 paper', 'https://zenodo.org/records/14256909'], ['ICLS 2025 paper', 'https://doi.org/10.22318/icls2025.114782']] },
      { key: 'amblyopia', venue: 'ICVR 2022', title: 'VR × BCI for amblyopia',
        paper: 'Interactive Brain-Computer System for Assessing Binocular Rivalry and Amblyopia Based on VR',
        lede: 'When the two eyes see different patterns, they compete. We used a VR headset as two separate screens and read the brain’s answer with SSVEP to measure that rivalry.',
        meta: [['Year', '2021 – 2022'], ['Role', 'First author · VR system, experiment'], ['Tools', 'VR headset · Unity · EEG / SSVEP'], ['Team', 'Qinglan Shan, Kaiying Mao, Yu Cheng, Yuhan Dong, et al.']],
        hero: { amb: true }, heroCap: 'The system: each eye gets its own flicker frequency (7 Hz and 12.5 Hz) inside the headset, while EEG picks up which eye wins.',
        stats: [['16', 'participants'], ['5', 'stimulation conditions'], ['70 s', 'per stimulation epoch']],
        story: [
          ['the problem', 'Glasses and stereoscopes struggle to show each eye its own image, or to change it dynamically, so binocular rivalry is hard to measure.'],
          ['what we built', 'SSVEP stimuli built into virtual scenes (trees, a lawn, a river) and shown separately to each eye, with live EEG processing and a rehabilitation game on top.']
        ],
        threads: [], quote: '', quoteBy: '',
        gallery: [['Six scenes, A to F, each eye seeing its own version', 'a270e6139fe86b425fba8ec6e0771018.webp', false, false]],
        links: [['IEEE paper', 'https://ieeexplore.ieee.org/abstract/document/9847922']] }
    ];
    this.keys = projects.map((x) => x.key);
    const i = Math.min(Math.max(this.state.p, 0), projects.length - 1);
    const x = projects[i];
    const pad = (n) => String(n).padStart(2, '0');
    const go = (k) => { this.setState({ p: k }); try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {} };
    return {
      tabs: projects.map((y, k) => ({ no: pad(k + 1), title: y.title, on: k === i, pressed: k === i ? 'true' : 'false', color: k === i ? '#22201C' : '#5C564C', pick: () => go(k) })),
      p: {
        venue: x.venue, title: x.title, paper: x.paper, lede: x.lede,
        heroVideo: x.hero.video ? B + x.hero.video : '', diagram: !!x.hero.diagram, amb: !!x.hero.amb, heroCap: x.heroCap,
        meta: x.meta.map(([k, v]) => ({ k, v })),
        stats: x.stats.map(([v, k]) => ({ v, k })), hasStats: x.stats.length > 0,
        story: x.story.map(([h, t]) => ({ h, t })),
        threads: x.threads.map((t) => ({ no: t.no, h: t.h, t: t.t, flow: !!t.flow, img: t.img ? B + t.img : '', alt: t.alt || '', quote: t.quote || '', quoteBy: t.quoteBy || '' })),
        hasThreads: x.threads.length > 0,
        quote: x.quote, quoteBy: x.quoteBy,
        gallery: x.gallery.map(([cap, id, wide, isVideo]) => ({ cap, cls: wide ? 'wide' : '', video: isVideo ? B + id : '', src: isVideo ? '' : B + id })),
        hasGallery: x.gallery.length > 0,
        links: x.links.map(([label, href]) => ({ label, href }))
      },
      nextTitle: projects[(i + 1) % projects.length].title,
      goNext: () => go((i + 1) % projects.length)
    };
  }
}
</script>
<script src="assets/site/site.js"></script>
<script src="assets/site/runtime.js"></script>
