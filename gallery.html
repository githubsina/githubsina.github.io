<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery · Qinglan Shan</title>
<meta name="description" content="Photographs by Qinglan Shan: St. Moritz, travel, landscape and street.">
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="assets/site/fonts.css">
<style>
body{margin:0;background-color:#22201C}
a{color:#FBF8F1}a:hover{color:#E8775C}
.navlink{text-decoration:none;font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif;font-size:14px;padding:10px 4px;border-bottom:2px solid transparent;color:#FBF8F1;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.navlink:hover{border-bottom-color:#E8775C;color:#FBF8F1}
.lang{background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;color:inherit;min-height:40px}
/* hero: slow drift, and the albums slide up over it like a curtain */
.kb{animation:kb 22s ease-out both}
@keyframes kb{from{transform:scale(1.14) translateY(1.5%)}to{transform:scale(1.02)}}
.cue{animation:cue 1.8s ease-in-out infinite}
@keyframes cue{50%{transform:translateY(8px)}}
.intro{animation:intro 1.4s cubic-bezier(.2,.7,.2,1) .2s both}
@keyframes intro{from{opacity:0;transform:translateY(24px);letter-spacing:.12em}to{opacity:1;transform:none}}
/* album cards */
.album{display:flex;flex-direction:column;gap:14px;background:none;border:0;padding:0;cursor:pointer;color:#FBF8F1;text-align:left;width:100%}
.album .frame{overflow:hidden;display:block;position:relative}
.album .frame img,.album .frame .ph{display:block;width:100%;height:auto;transition:transform 1.1s cubic-bezier(.2,.7,.2,1),filter .6s ease;filter:saturate(.9)}
.album:hover .frame img,.album:focus-visible .frame img{transform:scale(1.06);filter:saturate(1.05)}
.album .more{display:inline-flex;align-items:center;gap:8px;font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif;font-size:12px;letter-spacing:.14em;color:#B3AA98;transition:gap .3s ease,color .3s ease}
.album:hover .more,.album:focus-visible .more{gap:16px;color:#E8775C}
.album:focus-visible{outline:2px dashed #E8775C;outline-offset:8px}
.album .scrib path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .6s ease}
.album:hover .scrib path,.album:focus-visible .scrib path{stroke-dashoffset:0}
.ph{background-color:#2E2B26;background-image:repeating-linear-gradient(-45deg,rgba(251,248,241,.05) 0 2px,transparent 2px 12px)}
@supports (animation-timeline: view()){
  .rise{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 35%}
  @keyframes rise{from{opacity:0;transform:translateY(90px);clip-path:inset(18% 0 0 0)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
}
/* album sheet: opens like an iris, photos drift in one by one */
.iris{animation:iris .9s cubic-bezier(.7,0,.2,1) both}
@keyframes iris{from{clip-path:circle(0% at 50% 55%)}to{clip-path:circle(150% at 50% 55%)}}
.drift{animation:drift .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes drift{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.tile{display:block;position:relative;background:none;border:0;padding:0;cursor:zoom-in;overflow:hidden}
.tile img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .3s}
.tile:hover img{transform:scale(1.04)}
.tile:focus-visible{outline:2px dashed #E8775C;outline-offset:3px}
.txt{background:none;border:0;cursor:pointer;font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif;font-size: 18px;color:#FBF8F1;padding:10px 8px;min-height:44px; letter-spacing: -.01em}
.txt:hover{color:#E8775C}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.kb,.cue,.intro,.iris,.drift,.rise{animation:none!important}}
</style>
<link rel="stylesheet" href="assets/site/site.css">
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="color: #FBF8F1; font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; background-color: #22201C">

<!-- HERO: one wide photograph, sticky so the albums slide over it -->
<section style="position: sticky; top: 0; z-index: 0; height: min(100vh, 880px); min-height: 520px; overflow: hidden">
<img class="kb" src="assets/site/a7478165d4f23c0b986f5f51c820ecb1.webp" alt="Clouds over a hillside village" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(20,18,16,.45), rgba(20,18,16,0) 30%, rgba(20,18,16,0) 60%, rgba(20,18,16,.55))"></div>
<header style="position: absolute; left: 0; right: 0; top: 0; max-width: 1240px; margin: 0 auto; padding: 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" aria-label="{{t.nav.home}}" style="text-decoration: none; display: flex; align-items: center; padding: 4px 0"><img src="assets/site/f263d74ed1eebd543953fc578079680c.webp" alt="Shan, Qinglan" style="display: block; height: 58px; width: auto; filter: brightness(0) invert(1) drop-shadow(0 1px 8px rgba(0,0,0,.35))"></a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px"><a class="navlink" href="index.html#about">{{t.nav.about}}</a><a class="navlink" href="gallery.html" style="border-bottom-color: #FBF8F1">{{t.nav.gallery}}</a><a class="navlink" href="xr-lab.html">{{t.nav.xrlab}}</a><a class="navlink" href="research.html">{{t.nav.research}}</a><button class="navlink lang" onClick="{{toggleLang}}" aria-label="{{t.nav.langLabel}}">{{t.nav.lang}}</button></nav>
</header>
<div class="intro" style="position: absolute; left: 24px; right: 24px; top: 40%; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; text-shadow: 0 2px 18px rgba(0,0,0,.35)">
<h1 style="margin: 0; font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-weight: 600; font-size: clamp(51px, 10vw, 106px); line-height: 1.02; letter-spacing: -.01em">{{t.hero.title}}</h1>
<p style="margin: 0; font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-size: 13px; letter-spacing: .28em; text-transform: uppercase">{{t.hero.sub}}</p>
</div>
<p class="cue" style="position: absolute; left: 0; right: 0; bottom: 28px; margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-size: 18px; letter-spacing: -.01em">{{t.hero.cue}}
<svg aria-hidden="true" viewBox="0 0 30 40" style="width: 22px; height: 30px"><path d="M15 3 C 13 14, 17 24, 15 35 M7 27 L15 36 L23 27" fill="none" stroke="#FBF8F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></p>
</section>

<!-- ALBUMS: staggered two-column list, slides up over the hero -->
<section style="position: relative; z-index: 1; background: #22201C; box-shadow: 0 -24px 48px rgba(0,0,0,.35)">
<div style="max-width: 1120px; margin: 0 auto; padding: 96px 24px 160px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 72px">
<h2 style="margin: 0; font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-weight: 600; font-size: 38px; line-height: 1; letter-spacing: -.01em">{{t.albums.title}}</h2>
<a href="https://neo-prod.500px.com/user/vScIjlqit8h" style="font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-size: 18px; padding: 10px 0; letter-spacing: -.01em">{{t.albums.more}}</a>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); column-gap: 88px; row-gap: 96px; align-items: start">
<sc-for list="{{albums}}" as="a" hint-placeholder-count="4">
<div class="rise" style="margin-top: {{a.offset}}">
<button class="album" onClick="{{a.open}}" aria-label="Open album {{a.label}}">
<span style="font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-size: 12px; letter-spacing: .14em; color: #B3AA98">{{a.no}}</span>
<span class="frame">
<sc-if value="{{a.cover}}" hint-placeholder-val="{{ true }}">
<img src="{{a.cover}}" alt="" loading="lazy">
</sc-if>
<sc-if value="{{a.noCover}}" hint-placeholder-val="{{ false }}">
<span class="ph" style="aspect-ratio: {{a.ar}}; display: flex; align-items: center; justify-content: center; font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-size: 12px; color: #B3AA98">[{{a.label}} cover photo]</span>
</sc-if>
</span>
<span style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 6px">
<span style="position: relative; font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-size: 29px; line-height: 1; letter-spacing: -.01em">{{a.label}}
<svg class="scrib" aria-hidden="true" viewBox="0 0 200 14" preserveAspectRatio="none" style="position: absolute; left: -4%; bottom: -10px; width: 108%; height: 12px"><path pathLength="1" d="M3 8 C 50 3, 100 12, 197 6" fill="none" stroke="#E8775C" stroke-width="3" stroke-linecap="round"></path></svg></span>
<span class="more">{{a.meta}} <span aria-hidden="true">→</span></span>
</span>
</button>
</div>
</sc-for>
</div>
</div>
</section>

<!-- ALBUM SHEET -->
<sc-if value="{{hasAlbum}}" hint-placeholder-val="{{ false }}">
<div class="iris" role="dialog" aria-label="{{cur.label}}" style="position: fixed; inset: 0; z-index: 40; background: #1B1917; overflow-y: auto">
<div style="max-width: 1320px; margin: 0 auto; padding: 24px 24px 120px">
<div style="position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 0; background: #1B1917">
<button class="txt" onClick="{{closeAlbum}}">{{t.albums.back}}</button>
<span style="font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-size: 12px; letter-spacing: .14em; color: #B3AA98">{{cur.no}} / 04</span>
</div>
<div class="drift" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 48px 0 56px">
<h2 style="margin: 0; font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-weight: 600; font-size: clamp(38px, 7vw, 70px); line-height: 1.02; letter-spacing: -.01em">{{cur.label}}</h2>
<p style="margin: 0; font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #B3AA98">{{cur.meta}}</p>
</div>
<!-- justified rows: every row is flush on both edges, no captions -->
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<sc-for list="{{cur.photos}}" as="p" hint-placeholder-count="9">
<button class="tile drift" onClick="{{p.open}}" aria-label="View photo {{p.n}}" style="flex: {{p.grow}} 1 {{p.basis}}; aspect-ratio: {{p.ar}}; animation-delay: {{p.delay}}">
<img src="{{p.src}}" alt="{{p.alt}}" loading="lazy">
</button>
</sc-for>
<span aria-hidden="true" style="flex: 1000 1 0px"></span>
</div>
<sc-if value="{{cur.empty}}" hint-placeholder-val="{{ false }}">
<div style="max-width: 760px; margin: 0 auto; aspect-ratio: 3 / 2; border: 2px dashed #5C564C; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<p style="margin: 0; font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-size: 24px; color: #B3AA98; letter-spacing: -.01em">{{t.albums.empty}}</p>
<p style="margin: 0; font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-size: 12px; color: #B3AA98">[{{cur.label}} — photos coming soon]</p>
</div>
</sc-if>
</div>
</div>
</sc-if>

<!-- LIGHTBOX -->
<sc-if value="{{big}}" hint-placeholder-val="{{ false }}">
<div style="position: fixed; inset: 0; z-index: 60; background: rgba(18,16,14,.97); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px">
<img class="fade" src="{{shot.src}}" alt="{{shot.alt}}" style="display: block; max-width: 100%; max-height: 82vh; width: auto; height: auto">
<div style="display: flex; align-items: center; gap: 20px">
<button class="txt" onClick="{{prev}}">{{t.photo.prev}}</button>
<span style="font-family: 'Josefin Sans', 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', 'Source Han Serif SC', sans-serif; font-size: 12px; color: #B3AA98">{{shot.n}} / {{shot.total}}</span>
<button class="txt" onClick="{{next}}">{{t.photo.next}}</button>
<button class="txt" onClick="{{closeBig}}">{{t.photo.close}}</button>
</div>
</div>
</sc-if>
</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { album: -1, shot: -1, lang: this.qsLang() };
  }
  // Text in both languages comes from content/*.md (filled in by _tools/content.py).
  i18n() { return /*I18N*/{"en":{"nav":{"about":"About Me","gallery":"Gallery","xrlab":"XR Lab","research":"Research","lang":"中文","langLabel":"切换到中文","home":"Qinglan Shan, home"},"proj":{"all":"← all projects","threads":"two threads in one study","next":"Next project","more":"read the project"},"page":{"title":"Gallery · Qinglan Shan"},"hero":{"title":"Photographs","sub":"Landscapes, streets & travels · Sony A7C","cue":"More albums"},"albums":{"title":"albums","more":"more on 500px ↗","count":"{n} photos","see":"see more","back":"← albums","empty":"still in the darkroom"},"album":{"1":"St. Moritz | Engadin · autumn 2026","2":"Travel | on the road","3":"Landscape | hills, lakes & cows","4":"Street | city corners"},"photo":{"prev":"← prev","next":"next →","close":"close"}},"zh":{"nav":{"about":"关于我","gallery":"摄影","xrlab":"XR 实验室","research":"研究","lang":"EN","langLabel":"Switch to English","home":"单晴岚，回到首页"},"proj":{"all":"← 全部项目","threads":"一项研究，两条线索","next":"下一个项目","more":"查看项目"},"page":{"title":"摄影 · 单晴岚"},"hero":{"title":"摄影作品","sub":"风景、街头与旅行 · Sony A7C","cue":"更多相册"},"albums":{"title":"相册","more":"在 500px 上看更多 ↗","count":"{n} 张照片","see":"查看更多","back":"← 返回相册","empty":"还在暗房里冲洗"},"album":{"1":"圣莫里茨 | 恩加丁 · 2026 年秋","2":"旅行 | 在路上","3":"风景 | 山丘、湖泊和奶牛","4":"街头 | 城市角落"},"photo":{"prev":"← 上一张","next":"下一张 →","close":"关闭"}}}/*/I18N*/; }
  qsLang() {
    try {
      const q = new URLSearchParams(window.location.search).get('lang');
      if (q === 'zh' || q === 'en') { window.localStorage.setItem('qs-lang', q); return q; }
      const s = window.localStorage.getItem('qs-lang');
      if (s === 'zh' || s === 'en') return s;
      return 'en'; // English unless the visitor picks 中文
    } catch (e) { return 'en'; }
  }
  toggleLang() {
    const lang = this.state.lang === 'zh' ? 'en' : 'zh';
    try {
      window.localStorage.setItem('qs-lang', lang);
      if (/[?&]lang=/.test(window.location.search)) window.history.replaceState(null, '', window.location.pathname + window.location.hash);
    } catch (e) {}
    this.setState({ lang });
  }
  applyLang(title) {
    try { document.documentElement.lang = this.state.lang === 'zh' ? 'zh-CN' : 'en'; if (title) document.title = title; } catch (e) {}
  }
  rows(o) { return Object.keys(o || {}).filter((k) => /^\d+$/.test(k)).sort((a, b) => a - b).map((k) => String(o[k]).split(/\s*\|\s*/)); }
  componentDidMount() { this.applyLang(this.i18n()[this.state.lang].page.title); }
  componentDidUpdate() { this.applyLang(this.i18n()[this.state.lang].page.title); }

  renderVals() {
    const B = 'assets/site/';
    const t = this.i18n()[this.state.lang === 'zh' ? 'zh' : 'en'] || {};
    const names = this.rows(t.album);
    const count = (n) => String((t.albums || {}).count || '{n} photos').replace('{n}', n);
    const L = 2000 / 1333; const T = 1333 / 2000;
    const P = (alt, id, r) => ({ alt, src: B + id, r });
    const albums = [
      { label: 'St. Moritz', meta: 'Engadin · autumn 2026', cover: B + 'e423fdbeb5591d10bc3038c04c87a4d7.webp', ar: '2 / 3', photos: [
        P('Larches, twice', 'e423fdbeb5591d10bc3038c04c87a4d7.webp', T),
        P('Fog lifting off the lake', '77ab61bb72631fdcb612ac28268fe512.webp', L),
        P('Blue morning, still water', 'fb91f517b260aeaa3d83f9e5619c7f81.webp', L),
        P('Sun through the larches', '6a3c4e84e18029dc73ece87a124b7143.webp', 1325 / 2000),
        P('Gold below the snowline', '0c9422b879693ae9346ea83ba20f79bd.webp', L),
        P('Rowing boat, October', 'a1f779e43e5ada07deb3666ff3a00314.webp', L),
        P('Framed in larch', '6b42ac70393a4099ba8122741a286f0a.webp', L),
        P('Watching the light', '9361b21417fbc041dfa1021dee754a13.webp', L),
        P('Farmhouse in the gold', '1e44e1d2825924a8ff9dafb1b1912302.webp', 2000 / 1298),
        P('Mirror morning', 'dd60740ddbc90d00da1a01a58ecd1c39.webp', L),
        P('River valley', 'e93cb0da6ea02bc9149cfb9f85556cec.webp', L),
        P('Into the larch forest', '37280db20f099fe596cc9f9397283498.webp', L)
      ] },
      { label: 'Travel', meta: 'on the road', cover: B + '11ec71778c22a2fe04d60b90c6e3049c.webp', ar: '1438 / 2000', photos: [
        P('Travel photo 1', '11ec71778c22a2fe04d60b90c6e3049c.webp', 1438 / 2000),
        P('Travel photo 2', '600b4bfd9ede875c1a2223f33b0f3599.webp', 1333 / 2000),
        P('Travel photo 3', '6a910afcd17f24b8cc8013dcc888415f.webp', 2000 / 1334),
        P('Travel photo 4', 'bede469aa80516a57ab1eeb37d6221f7.webp', 1347 / 2000),
        P('Travel photo 5', 'dfa53c714c95e52baa19babc6186232c.webp', 1274 / 2000),
        P('Travel photo 6', '0908e0a71d15b6d265c26f3c6f3e8467.webp', 2000 / 1333),
        P('Travel photo 7', 'ad55a145718f4b8e6ed6e3861962e15d.webp', 1411 / 2000),
        P('Travel photo 8', '225fb52e944ef9f2ac06c69bff61944a.webp', 1333 / 2000),
        P('Travel photo 9', '60cea1e38d12f14e5d86b4f16cd65b76.webp', 2000 / 1333),
        P('Travel photo 10', 'aae63f0ea483663b7257cb761affb9c3.webp', 1333 / 2000),
        P('Travel photo 11', 'd6e4d54ee3f9552aa617f2659dde54dc.webp', 1510 / 2000),
        P('Travel photo 12', 'b089ae309a35255fa778a3c42783daa7.webp', 2000 / 1333),
        P('Travel photo 13', '4485b519bc71ebe8431e171a9be6eebc.webp', 1333 / 2000)
      ] },
      { label: 'Landscape', meta: 'hills, lakes & cows', cover: B + '8a31d029784722489bae892fabd76bc4.webp', ar: '1334 / 2000', photos: [
        P('Landscape photo 1', '8a31d029784722489bae892fabd76bc4.webp', 1334 / 2000),
        P('Landscape photo 2', '74d4f5e095ad794ab8b4870395adfd5e.webp', 2000 / 1333),
        P('Landscape photo 3', '89d1d96f2acdfd384877e9a59ca21264.webp', 1333 / 2000),
        P('Landscape photo 4', 'a7478165d4f23c0b986f5f51c820ecb1.webp', 2000 / 1125),
        P('Landscape photo 5', '093fbfedd47355a601f7bd8dca43a12f.webp', 1333 / 2000),
        P('Landscape photo 6', 'e29906873e0c9e512ee47375e743f5d2.webp', 2000 / 1333),
        P('Landscape photo 7', '965910ce2aca4d9fd221c2e0220917bd.webp', 1333 / 2000),
        P('Landscape photo 8', '0e236aa00c5a667249e41a9776508da5.webp', 1333 / 2000),
        P('Landscape photo 9', '6ac28dab09b113c5fb6afde68ac00c3c.webp', 1125 / 2000),
        P('Landscape photo 10', '83925eaae51cc0a71aa9913acb9d826c.webp', 1315 / 2000)
      ] },
      { label: 'Street', meta: 'city corners', cover: B + '201dbe81de90c550bc440402f194c32a.webp', ar: '2000 / 1318', photos: [
        P('Street photo 1', '201dbe81de90c550bc440402f194c32a.webp', 2000 / 1318),
        P('Street photo 2', '2b42acc8a0eefa5f0c8505b4c55f5ba6.webp', 1347 / 2000),
        P('Street photo 3', '6c46557f599d35c2de3fe5913fcdcdaf.webp', 1914 / 2000)
      ] }
    ];
    const ai = this.state.album;
    albums.forEach((x, k) => { if (names[k]) { x.label = names[k][0]; x.meta = names[k][1] || x.meta; } });
    const a = albums[ai];
    const photos = a ? a.photos.map((p, k) => ({
      ...p, n: k + 1, ar: p.r.toFixed(4), grow: Math.round(p.r * 100), basis: Math.round(p.r * 520) + 'px',
      delay: (0.35 + Math.min(k, 12) * 0.06).toFixed(2) + 's',
      open: () => this.setState({ shot: k })
    })) : [];
    const s = this.state.shot; const len = photos.length;
    const pad = (n) => String(n).padStart(2, '0');
    return {
      t,
      toggleLang: () => this.toggleLang(),
      albums: albums.map((x, i) => ({
        label: x.label, no: pad(i + 1), cover: x.cover, noCover: !x.cover, ar: x.ar,
        meta: x.photos.length ? count(x.photos.length) + ' · ' + ((t.albums || {}).see || '') : x.meta,
        offset: i % 2 ? '160px' : '0px',
        open: () => this.setState({ album: i, shot: -1 })
      })),
      hasAlbum: !!a,
      cur: a ? { label: a.label, no: pad(ai + 1), meta: a.photos.length ? a.meta + ' · ' + count(a.photos.length) : a.meta, photos, empty: len === 0 } : { label: '', no: '', meta: '', photos: [], empty: false },
      closeAlbum: () => this.setState({ album: -1, shot: -1 }),
      big: s >= 0 && s < len,
      shot: s >= 0 && s < len ? { ...photos[s], total: len } : { src: '', alt: '', n: 0, total: 0 },
      closeBig: () => this.setState({ shot: -1 }),
      next: () => this.setState({ shot: (s + 1) % len }),
      prev: () => this.setState({ shot: (s - 1 + len) % len })
    };
  }
}
