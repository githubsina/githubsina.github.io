<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: this.qsLang() };
  }
  // Text in both languages comes from content/*.md (filled in by _tools/content.py).
  i18n() { return /*I18N*/{"en":{"nav":{"about":"About Me","gallery":"Gallery","xrlab":"XR Lab","research":"Research","lang":"中文","langLabel":"切换到中文","home":"Qinglan Shan, home"},"proj":{"all":"← all projects","threads":"two threads in one study","next":"Next project","more":"read the project"},"page":{"title":"Research · Qinglan Shan"},"kicker":"Research · publications","title":{"a":"How do you","b":"learn","c":"in mixed reality?"},"intro":"I study what happens to attention, cognitive load and skill when hands-on learning moves into mixed reality. I build the systems myself, then test them in real courses with controlled studies, questionnaires, eye-tracking and interaction logs, EEG and video coding, and turn the results into design principles. Supervised by Prof. Jürgen Brugger (EPFL) and Prof. Manu Kapur (ETH Zürich).","tag":{"1":"Embodied learning","2":"Mixed reality","3":"Cleanroom training","4":"Design-based research","5":"HCI","6":"VR + EEG"},"pubs":{"title":"Publications"},"edu":{"title":"Education","1":"2022 – 2026 | PhD Learning Science | EPFL × ETH Zürich · MRTK, Unity, Blender, C#","2":"2019 – 2022 | MSc Computer Science | Tsinghua University · VR and brain–computer interfaces · second-class school scholarship","3":"2015 – 2019 | BSc Industrial Design | Chengdu University of Technology · national scholarship"},"teach":{"title":"teaching","1":"Microfabrication technologies, EPFL · 2023–24","2":"MEMS Practicals, EPFL · 2023–24","3":"Social Innovation Design, Tsinghua · 2021–22"},"cv":"download CV →"},"zh":{"nav":{"about":"关于我","gallery":"摄影","xrlab":"XR 实验室","research":"研究","lang":"EN","langLabel":"Switch to English","home":"单晴岚，回到首页"},"proj":{"all":"← 全部项目","threads":"一项研究，两条线索","next":"下一个项目","more":"查看项目"},"page":{"title":"研究 · 单晴岚"},"kicker":"研究 · 论文发表","title":{"a":"我们如何在混合现实中","b":"学习","c":"？"},"intro":"我研究动手学习搬进混合现实之后，注意力、认知负荷和技能会发生什么变化。系统由我自己搭建，再放到真实课程中检验：对照实验、问卷、眼动与交互日志、脑电和视频编码，最后把结果凝练成设计原则。导师为 Jürgen Brugger 教授（EPFL）和 Manu Kapur 教授（ETH Zürich）。","tag":{"1":"具身学习","2":"混合现实","3":"洁净室培训","4":"基于设计的研究","5":"人机交互","6":"VR + 脑电"},"pubs":{"title":"论文发表"},"edu":{"title":"教育经历","1":"2022 – 2026 | 学习科学 博士 | 洛桑联邦理工学院 × 苏黎世联邦理工学院 · MRTK、Unity、Blender、C#","2":"2019 – 2022 | 计算机科学与技术 硕士 | 清华大学 · VR 与脑机接口 · 校级二等奖学金","3":"2015 – 2019 | 工业设计 学士 | 成都理工大学 · 国家奖学金"},"teach":{"title":"教学","1":"微加工技术，EPFL · 2023–24","2":"MEMS 实验课，EPFL · 2023–24","3":"社会创新设计，清华大学 · 2021–22"},"cv":"下载简历 →"}}/*/I18N*/; }
  qsLang() {
    try {
      const q = new URLSearchParams(window.location.search).get('lang');
      if (q === 'zh' || q === 'en') { window.localStorage.setItem('qs-lang', q); return q; }
      const s = window.localStorage.getItem('qs-lang');
      if (s === 'zh' || s === 'en') return s;
      return /^zh/i.test(window.navigator.language || '') ? 'zh' : 'en';
    } catch (e) { return 'en'; }
  }
  toggleLang() {
    const lang = this.state.lang === 'zh' ? 'en' : 'zh';
    try {
      window.localStorage.setItem('qs-lang', lang);
      if (/[?&]lang=/.test(window.location.search)) window.history.replaceState(null, '', window.location.pathname + window.location.hash);
    } catch (e) {}
    this.setState({ lang });
  }
  applyLang(title) {
    try { document.documentElement.lang = this.state.lang === 'zh' ? 'zh-CN' : 'en'; if (title) document.title = title; } catch (e) {}
  }
  rows(o) { return Object.keys(o || {}).filter((k) => /^\d+$/.test(k)).sort((a, b) => a - b).map((k) => String(o[k]).split(/\s*\|\s*/)); }
  componentDidMount() { this.applyLang(this.i18n()[this.state.lang].page.title); }
  componentDidUpdate() { this.applyLang(this.i18n()[this.state.lang].page.title); }
  renderVals() {
    const zh = this.state.lang === 'zh';
    const t = this.i18n()[zh ? 'zh' : 'en'] || {};
    return {
      t, sp: zh ? '' : ' ', toggleLang: () => this.toggleLang(),
      tags: this.rows(t.tag).map(([label]) => ({ label })),
      edu: this.rows(t.edu).filter((r) => r.length > 1).map(([when, what, where]) => ({ when, what: what || '', where: where || '' })),
      teach: this.rows(t.teach).map((r) => ({ label: r.join(' | ') }))
    };
  }
}
</script>
