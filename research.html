<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3A3730; max-width: 60ch">I study what happens to attention, cognitive load and skill when hands-on learning moves into mixed reality. I build the systems myself, then test them in real courses with controlled studies, questionnaires, eye-tracking and interaction logs, EEG and video coding, and turn the results into design principles. Supervised by Prof. Jürgen Brugger (EPFL) and Prof. Manu Kapur (ETH Zürich).</p>
